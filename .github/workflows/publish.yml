name: publish

# 用 PyPI Trusted Publishing（OIDC）发布，不保存任何 API token。
#
# 首次发布前，在 https://pypi.org/manage/account/publishing/ 添加：
#   PyPI Project Name   auditloop
#   Owner               ReZeroStarting
#   Repository name     auditloop
#   Workflow name       publish.yml
#   Environment name    pypi
#
# 之后：发一个 GitHub Release，或手动触发本工作流。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m auditloop eval run --mode mock --gate 0.9

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
