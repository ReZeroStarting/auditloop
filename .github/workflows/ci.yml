name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no runtime dependencies on purpose)
        run: python -m pip install --no-deps -e .
      - name: Install test runner
        run: python -m pip install pytest
      - name: Import check
        run: python -c "import auditloop; print(auditloop.__version__)"
      - name: Tests
        run: python -m pytest -q
      - name: Doctor (environment self-check)
        run: python -m auditloop doctor
      - name: Demo (offline end-to-end)
        run: python -m auditloop demo
      - name: Eval gate
        run: python -m auditloop eval run --mode mock --gate 0.9
